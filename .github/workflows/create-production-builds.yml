# APK oluşturma workflow'u
# - EAS CLI veya Expo sunucularını kullanmaz; EXPO_TOKEN gerekmez
# - GitHub Actions'ın kendi sunucusunda (ubuntu-latest) Gradle ile APK üretir
# - Paket uyuşmazlığını önlemek için `npm ci` ile package-lock.json'a sadık kalınır
name: Create Production Builds

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (locked via package-lock.json)
        run: npm ci

      - name: Generate native Android project (no Expo account needed)
        run: npx expo prebuild --platform android --clean

      - name: Build release APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/**/*.apk
